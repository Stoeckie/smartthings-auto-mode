name: automode-zone-hold
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: silvervalley08660.autoMode
        version: 1
      - id: silvervalley08660.autoSignal
        version: 1
    categories:
      - name: RemoteController
preferences:
  - name: manualMinutes
    title: Manual for (minutes)
    description: "How long the zone stays Manual after someone operates one of its devices by hand. Every new manual change starts this time again. 0 = stays Manual until you switch it on. In the app: switch on = Automatic, off = Manual."
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 1440
      default: 0
  - name: busySeconds
    title: Routine window (seconds)
    description: "How long a device that a routine started (lamp, curtain, heating) may keep changing and still be the routine's: a late level, a curtain still moving or stopped part-way. A change after this is manual. 0 = only the start time counts."
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 900
      default: 120
  - name: startSeconds
    title: Start time (seconds)
    description: "How long after a routine acts (or after its previous device started) a device may start changing and still be the routine's. 0 = standard (lights 10, heating 15, shades 30 s). Lower it (e.g. 2) so a switch pressed right after a routine is manual; raise it for slow devices."
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 300
      default: 0
