name: automode-zone-hold
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: silvervalley08660.autoMode
        version: 1
      - id: silvervalley08660.autoSignal
        version: 1
    categories:
      - name: RemoteController
preferences:
  - name: manualMinutes
    title: Manual for (minutes)
    description: "How long the zone stays Manual after someone operates one of its devices by hand. Every new manual change starts this time again. 0 = stays Manual until you switch it on. In the app: switch on = Automatic, off = Manual."
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 1440
      default: 0
  - name: busySeconds
    title: Routine window (seconds)
    description: "How long a device may keep changing after a routine started it. It must start within 10 to 30 s, otherwise the change is manual. A curtain the routine moved may report anything in this time (stopped part-way, late end position)."
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 900
      default: 120
